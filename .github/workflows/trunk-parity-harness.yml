# COREDEV-2780 M2c — the PARITY HARNESS. Non-required; emits no gating context.
#
# WHY IT EXISTS. Cells 1 and 5 assert things about a REAL run of the pinned action that no Python test
# can observe — `uses:` is resolved by the Actions runner, not by unittest — and that the shipped
# workflow cannot report either, because C8 makes the Trunk action its FINAL step, so nothing there can
# hash the tree afterwards. This workflow is the SENSOR; `scripts/tests/test_trunk_upstream_parity.py`
# is the JUDGE. Same shape as cells 10 and 12: a real run reports, a test decides.
#
# WHY IT FIRES ON REAL EVENTS, ON DEDICATED REFS. Revision 26 made it `workflow_dispatch`-only, which
# is self-defeating: the pinned action maps `workflow_dispatch` to check-mode=all — the very reason
# dispatch is banned from `trunk-check` — and `GITHUB_EVENT_NAME` cannot be overridden, because GitHub
# forbids overriding `GITHUB_*`. Naming an artifact `parity-pull_request.json` does not make the action
# take its PR path. So it fires on the real events, on refs that exist for this purpose. Branch filters
# are safe HERE precisely because the workflow is non-required: a skipped harness leaves no context
# pending.
#
# `harness-base` and `harness/**` ARE PERMANENT REPOSITORY CITIZENS, not scratch refs — every
# Dependabot bump of the action pin must re-run this harness to re-derive the extension-point
# enumeration, so deleting them is a change rather than tidying. Documented in CLAUDE.md.
name: trunk-parity-harness

on:
  pull_request:
    branches: [harness-base]
  push:
    branches: [harness/**]

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # The deliberately-fixable fixture is MEANT to make the Trunk step fail. Without this the job
    # would stop there and the evidence would simply never be produced.
    continue-on-error: true
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: extract-and-bind-action-inputs
        id: inputs
        # THE HARNESS MUST RUN WHAT SHIPS. A harness that invokes its own non-fixing form proves only
        # that THAT form does not mutate, while the shipped job could invoke an autofixing one and
        # still reach cell 5 green. The inputs are therefore EXTRACTED from the shipped workflow and
        # digest-bound to it. The digest covers the extracted `with:` block rather than the whole file,
        # so an unrelated edit (M3 removing `continue-on-error`) does not falsely void the binding
        # while a change to what the action is actually passed still does.
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json, os, yaml
          workflow = yaml.safe_load(open(".github/workflows/trunk-check.yml", encoding="utf-8"))
          job = next(iter(workflow["jobs"].values()))
          trunk = next(s for s in job["steps"] if "trunk-io/trunk-action" in str(s.get("uses", "")))
          used = trunk["with"]
          canonical = json.dumps(used, sort_keys=True, separators=(",", ":"))
          digest = hashlib.sha256(canonical.encode()).hexdigest()
          expected = "cc125ae649d85ba092aa5a92fe187df6d4d235e896a8b17a267b7f1e6a77cd36"
          if digest != expected:
              raise SystemExit(
                  f"the shipped action inputs changed: expected {expected}, got {digest} ({canonical}).\n"
                  "Re-run this harness and update the pin — the harness must run what ships."
              )
          print(f"arguments={used['arguments']}")
          print(f"save_annotations={str(used['save-annotations']).lower()}")
          print(f"canonical={canonical}")
          print(f"digest={digest}")
          print("uses=" + trunk["uses"])
          PY

      - name: stage-the-deliberately-fixable-fixture
        # Running the action over already-canonical files proves NOTHING: autofix would produce no byte
        # change there either, so the case would REACH the wrong implementation without killing it. The
        # fixture is mis-indented on purpose, and `git add` makes it tracked so cell 5's claim — no
        # TRACKED file's bytes change — actually bites.
        run: |
          set -euo pipefail
          mkdir -p harness-fixtures
          printf '#!/usr/bin/env bash\nif true; then\n      echo "deliberately   mis-indented"\n   fi\n' \
            > harness-fixtures/fixable.sh
          git add --force harness-fixtures/fixable.sh
          echo "fixture staged:"; sed -n '1,10p' harness-fixtures/fixable.sh

      - name: hash-tracked-tree-before
        run: |
          set -euo pipefail
          git ls-files -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 > /tmp/tree.pre
          sha256sum harness-fixtures/fixable.sh | cut -d' ' -f1 > /tmp/fixture.pre
          cat /tmp/tree.pre

      - name: resolve-the-range-with-the-shared-implementation
        # The value cell 1 compares the captured argv against. ONE implementation: this is the same
        # script the shipped workflow's guard invokes, so parity is a PROPERTY rather than an agreement
        # between two things that might both be wrong.
        env:
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          bash scripts/ci/resolve-trunk-range.sh > /tmp/resolver.out
          cat /tmp/resolver.out

      - name: install-a-real-trunk-for-the-recorder-to-delegate-to
        run: |
          set -euo pipefail
          curl -fsSL https://trunk.io/releases/trunk -o /tmp/real-trunk
          chmod u+x /tmp/real-trunk
          : > /tmp/argv.jsonl

      - name: trunk
        uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
        env:
          PARITY_ARGV_FILE: /tmp/argv.jsonl
          PARITY_REAL_TRUNK: /tmp/real-trunk
        with:
          # THE ONE LEGITIMATE USE OF `trunk-path` — §1's C4 forbids it in the shipped workflows.
          trunk-path: scripts/ci/parity-recorder.sh
          arguments: ${{ steps.inputs.outputs.arguments }}
          save-annotations: ${{ steps.inputs.outputs.save_annotations }}

      - name: hash-tracked-tree-after
        if: always()
        run: |
          set -euo pipefail
          git ls-files -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 > /tmp/tree.post
          sha256sum harness-fixtures/fixable.sh | cut -d' ' -f1 > /tmp/fixture.post
          cat /tmp/tree.post

      - name: assemble-the-parity-artifact
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          def read(path, default=""):
              p = pathlib.Path(path)
              return p.read_text(encoding="utf-8").strip() if p.exists() else default
          invocations = [json.loads(line) for line in
                         read("/tmp/argv.jsonl").splitlines() if line.strip()]
          event = os.environ["GITHUB_EVENT_NAME"]
          record = {
              "schemaVersion": 1,
              "event": event,
              "ref": os.environ.get("GITHUB_REF_NAME", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "resolver": {"raw": read("/tmp/resolver.out")},
              "invocations": invocations,
              "tree": {
                  "pre": read("/tmp/tree.pre"),
                  "post": read("/tmp/tree.post"),
                  "fixture": "harness-fixtures/fixable.sh",
                  "fixturePre": read("/tmp/fixture.pre"),
                  "fixturePost": read("/tmp/fixture.post"),
              },
              "actionInputs": {
                  "canonical": os.environ.get("PARITY_INPUTS_CANONICAL", ""),
                  "digest": os.environ.get("PARITY_INPUTS_DIGEST", ""),
                  "uses": os.environ.get("PARITY_INPUTS_USES", ""),
              },
          }
          pathlib.Path(f"parity-{event}.json").write_text(
              json.dumps(record, indent=2, sort_keys=True), encoding="utf-8")
          print(json.dumps(record, indent=2, sort_keys=True))
          PY
        env:
          PARITY_INPUTS_CANONICAL: ${{ steps.inputs.outputs.canonical }}
          PARITY_INPUTS_DIGEST: ${{ steps.inputs.outputs.digest }}
          PARITY_INPUTS_USES: ${{ steps.inputs.outputs.uses }}

      - name: upload-the-parity-artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parity-${{ github.event_name }}
          path: parity-*.json
          if-no-files-found: error
