# Plugin CI — Phase 0, Item 7 (COREDEV-2322)
# Treats the unleashed-mail PLUGIN's own assets as software. Linux-only, no Xcode:
# the Swift app is built by Xcode Cloud, not here. Actions are pinned to commit SHAs
# (AGENT_CONTRACTS.md §6 — never @vN tags).
#
# Rollout note: leave this OFF "required checks" in branch protection until it has had
# one clean green run on a PR (warn-first); then mark it required.
name: plugin-ci

on:
  push:
    # `main` is the trunk releases are cut from; `alpha` is a gated pre-release branch. BOTH are
    # gated, which is the point of this filter. Until COREDEV-2494
    # this triggered on `main` only, so 56 of alpha's 57 commits merged with ZERO checks: every audit
    # PR targeted alpha and reported "no checks". Worse, PR #36 ADDED `claude plugin validate` and #31
    # added actionlint — neither ever executed on the branch they were added to.
    branches: [main, alpha]
  pull_request:
    branches: [main, alpha]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Raised from 10: measured 3m00s, but this PR added an `apt-get install zsh` step whose duration
    # depends on the package mirror, so the headroom is less predictable than the median suggests.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the whitespace gate resolves origin/main to compute a merge base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install zsh (the shell the agent fence runs)
        # WITHOUT THIS NO CI JOB CAN EXECUTE ANY ZSH TEST. ubuntu-latest ships no zsh, so
        # test_plugin_state_base.py::test_zsh_agrees_with_bash self-skips here -- and the macOS leg
        # ran only the redactor suite. The exact regression that test exists to catch (a Bash-only
        # construct failing silently under zsh) could therefore land green (PR #63 review, gap 15).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Assert zsh is present so the agreement test cannot silently skip
        # A skip reads identically to a pass in the summary. Fail loudly if the install regressed.
        run: |
          command -v zsh || {
            echo "zsh missing - the zsh-agreement test would SKIP, not fail"
            exit 1
          }

      - name: Byte-compile Python (MCP + load-bearing scripts)
        id: py_compile
        run: python3 -m py_compile mcp/review-synthesizer/*.py scripts/lib/bash-write-scan.py scripts/pty-capture.py scripts/review-verdict.py scripts/review/bind-prompt.py scripts/review/callers_scan.py scripts/review/cleanup_coredev_2619_leaks.py scripts/review/containment.py scripts/review/generate-callers-exemptions.py scripts/review/snapshot-operands.py scripts/review/stage-bound-plan.py scripts/review/stage-prompt.py scripts/validate-hooks.py scripts/validate-plan-citations.py scripts/validate-plugin-assembly.py

      - name: pty-capture.py smoke test (--timeout + capture)
        id: pty_smoke
        run: |
          set -euo pipefail
          out="$(mktemp)"
          # A wedged child must time out (exit 124) with the partial transcript preserved.
          rc=0; python3 scripts/pty-capture.py --timeout 1 "$out" -- bash -c 'echo captured; sleep 5' || rc=$?
          test "$rc" = "124" || { echo "expected exit 124, got $rc"; exit 1; }
          grep -q "captured" "$out" || { echo "partial transcript not preserved"; cat "$out"; exit 1; }
          # A fast command completes normally and captures its output.
          python3 scripts/pty-capture.py "$out" -- echo ok
          grep -q "ok" "$out" || { echo "fast-path capture missing"; exit 1; }
          echo "pty-capture: --timeout=124 + capture OK"

      - name: Run the review-synthesizer test suite (discovery — count not hardcoded)
        id: mcp_tests
        run: python3 -m unittest discover -s mcp/review-synthesizer/tests -v

      - name: Run the scripts test suite (review-verdict gate artifact)
        id: scripts_tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Assert the ungated plugin-state classes RAN here (COREDEV-2691 §7.4)
        id: seam_ungated
        # These five are the plugin-state classes that exercise the ENTRY GUARD on this leg. Three
        # of them drive PRODUCTION callers through it -- and there are exactly three such callers:
        # `_unleashed_create_store`, `_unleashed_store_ok`, and `_unleashed_publish`. Covering only
        # the first left reader:282 and publisher:230/:252 unguarded here (codex, r7). Every chain-walking class in that file is @skipUnless(DARWIN) --
        # `_unleashed_auth_chain` refuses on all non-Darwin platforms -- so before COREDEV-2691 the
        # required check exercised no entry guard at all. (Other ungated classes in the file, e.g.
        # EncoderInvariantP and NameLengthBudget, do run here; they cover the encoder and the name
        # budget, not the guard. Revision 1's comment called these two the ONLY ungated classes,
        # which was simply false.)
        #
        # Counts are DERIVED from the loader and checked PER CLASS: an aggregate check passes when
        # one whole class contributes zero cells and the other makes up the number. What this
        # actually guards against is a SKIP, which reads identically to a pass in the job summary --
        # including the skip that a missing zsh would produce.
        #
        # No bare `assert`: python3 -O / PYTHONOPTIMIZE strips those and the step would exit 0 over
        # a red suite.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, unittest

          # name -> the MINIMUM cell count that class must contribute. A derived-only expectation
          # cannot see DELETION: remove ten cells and `expected` simply drops to match `ran`, and
          # the gate stays green having verified almost nothing (agy). Raise a floor when cells are
          # added; lowering one has to be a deliberate edit here.
          MINIMUMS = {"scripts.tests.test_plugin_state_store.SeamContract": 16,
                      "scripts.tests.test_plugin_state_store.ForkClassification": 10,
                      "scripts.tests.test_plugin_state_store.SeamedStoreCreation": 9,
                      "scripts.tests.test_plugin_state_store.SeamedReader": 6,
                      "scripts.tests.test_plugin_state_store.SeamedPublisher": 5}
          NAMES = list(MINIMUMS)
          problems = []
          for name in NAMES:
              suite = unittest.defaultTestLoader.loadTestsFromName(name)
              expected = suite.countTestCases()
              flat = list(unittest.TestSuite(suite))
              bogus = [t for t in flat if type(t).__name__ == "_FailedTest"]
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              print(f"{name}: expected={expected} ran={result.testsRun} "
                    f"skipped={len(result.skipped)} errors={len(result.errors)}")
              if bogus:
                  problems.append(f"{name}: loader produced {len(bogus)} placeholder(s) -- renamed?")
              if expected == 0:
                  problems.append(f"{name}: loader found NO cells -- a rename emptied this gate")
              if expected < MINIMUMS[name]:
                  problems.append(f"{name}: {expected} cells, floor is {MINIMUMS[name]} -- cells were deleted")
              if result.testsRun != expected:
                  problems.append(f"{name}: only {result.testsRun}/{expected} cells ran")
              if result.skipped:
                  problems.append(f"{name}: cells SKIPPED on this platform: {result.skipped}")
              if not result.wasSuccessful():
                  problems.append(f"{name}: RED here")
          if problems:
              print("SEAM GATE FAILED:")
              for p in problems:
                  print("  - " + p)
              sys.exit(1)
          print(f"seam gate: all {len(NAMES)} classes ran fully, nothing skipped")
          PY

      - name: Validate version sync (strict)
        id: version_sync
        run: VERSION_SYNC_ENFORCE=strict bash scripts/validate-version-sync.sh

      - name: Validate plugin assembly (strict)
        id: plugin_assembly
        run: python3 scripts/validate-plugin-assembly.py --root . --strict

      - name: Set up Node (for the Claude Code CLI)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'   # @anthropic-ai/claude-code requires Node >=22

      - name: Validate plugin with the Claude Code CLI (authoritative schema)
        id: claude_validate
        env:
          # Manual pin: there is no package.json here, so Dependabot's npm ecosystem does not
          # cover this. Bump it alongside the actionlint/gitleaks version pins below.
          # Opus 5 requires >= 2.1.219 (COREDEV-2583 §4.8). This pin drives
          # `claude plugin validate`, so the schema authority must not sit below the
          # floor the plugin targets. 2.1.220 is the `latest` dist-tag; pinning ahead of
          # `stable` is deliberate because stable is below the Opus 5 floor.
          CLAUDE_CODE_VERSION: 2.1.220
        run: |
          set -euo pipefail
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
          # Marketplace manifest schema (top-level entry point). --strict promotes warnings to
          # failures; verified green on the pinned CLI above before enabling (COREDEV-2494).
          claude plugin validate --strict .
          # Deep plugin validation — agents/skills/hooks schemas. Exits 0 on the expected
          # "root CLAUDE.md is a contributor doc, not shipped context" warning, non-zero on a
          # real schema error. House conventions (missing name/description, agent-key hygiene,
          # registry set-equality) are enforced more strictly by validate-plugin-assembly.py above.
          # FOLLOW-UP (PR #36 review): (1) once the root-CLAUDE.md warning is resolved, add `--strict`
          # here so an unrecognized/stale manifest field fails CI (not just warns); (2) integrity-verify
          # the pinned @anthropic-ai/claude-code tarball (npm pack + sha512) like actionlint/gitleaks.
          claude plugin validate .claude-plugin/plugin.json

      - name: Whitespace check (git diff --check)
        # `git diff --check` exits 2 on trailing whitespace and new blank lines at EOF. Five had
        # accumulated across this PR and nothing caught them: the pre-commit hook does not run it and
        # neither did CI. Checked against the merge base rather than the whole tree so history is not
        # re-litigated (PR #63 recheck, P3).
        id: whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # THE BASE IS EVENT-DEPENDENT (PR #63 recheck, P2). `GITHUB_BASE_REF` is populated on a
          # pull_request run and EMPTY on a push, so the old `${GITHUB_BASE_REF:-main}` made a main push
          # compute `merge-base(origin/main, HEAD) == HEAD` and check an EMPTY range — the gate did
          # nothing — while an alpha push re-checked the whole `main..alpha` divergence. Select the base
          # from the event, and FAIL CLOSED whenever the base cannot be resolved (which needs
          # `fetch-depth: 0`) rather than silently skipping.
          ZERO="0000000000000000000000000000000000000000"
          case "$EVENT_NAME" in
            pull_request)
              # The PR's real base branch — not a hard-coded `main` — so an alpha-targeting PR is diffed
              # against alpha and its accumulated history is not re-litigated.
              base_ref="${PR_BASE:?pull_request run carried no base ref}"
              git rev-parse --verify "origin/${base_ref}" >/dev/null 2>&1 \
                || { echo "origin/${base_ref} unavailable — this job needs fetch-depth: 0" >&2; exit 1; }
              base="$(git merge-base "origin/${base_ref}" HEAD)"
              ;;
            push)
              # The previous tip of the branch. All-zeros = a new branch with no ancestor, and an
              # unresolvable value = a shallow fetch; both fall back to the merge base with the default
              # branch so only THIS push's changes are checked, and fail closed if even that is absent.
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$ZERO" ] \
                   && git rev-parse --verify "$PUSH_BEFORE" >/dev/null 2>&1; then
                base="$PUSH_BEFORE"
              else
                git rev-parse --verify origin/main >/dev/null 2>&1 \
                  || { echo "no usable push ancestor and origin/main unavailable — needs fetch-depth: 0" >&2; exit 1; }
                base="$(git merge-base origin/main HEAD)"
              fi
              ;;
            *)
              # workflow_dispatch (and any future trigger): an explicit, documented base — the merge
              # base with the default branch.
              git rev-parse --verify origin/main >/dev/null 2>&1 \
                || { echo "origin/main unavailable — this job needs fetch-depth: 0" >&2; exit 1; }
              base="$(git merge-base origin/main HEAD)"
              ;;
          esac
          git diff --check "$base" HEAD

      - name: ShellCheck plugin scripts
        id: shellcheck_gate
        run: shellcheck -s bash -S warning scripts/*.sh scripts/lib/*.sh scripts/review/*.sh .githooks/pre-commit

      - name: Install actionlint (pinned + checksum-verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Lint GitHub Actions workflows (actionlint)
        id: actionlint_gate
        run: actionlint -color

      - name: Validate hooks manifest (strict)
        id: hooks_manifest
        run: python3 scripts/validate-hooks.py --root . --strict --require-manifest

      # COREDEV-2617: the plan-citation linter was only BYTE-COMPILED here, so a stale `:N`, an
      # undeclared enum value or an inconsistent phrase family stayed green as long as the Python
      # parsed — defeating the reason the validator exists (codex, PR #67). Both modes run: the
      # self-test proves the linter can fail, then it lints the plan it guards.
      - name: Plan-citation linter (self-test + the COREDEV-2617 plan)
        id: plan_lint
        run: |
          python3 scripts/validate-plan-citations.py --selftest docs/planning/COREDEV-2617_PLUGIN_STATE_BASE_DIR_PLAN.md
          python3 scripts/validate-plan-citations.py docs/planning/COREDEV-2617_PLUGIN_STATE_BASE_DIR_PLAN.md

      - name: Hook stdin-simulation tests (COREDEV-2324)
        id: hook_tests
        run: bash scripts/test-hooks.sh

      - name: Job summary
        if: ${{ always() }}
        # INF-2: report each gate's OWN outcome, not the single overall job.status (which made every row
        # show the same value — a failed shellcheck rendered "failure" next to gates that passed). A gate
        # that never ran (fail-fast stopped before it) has an empty outcome -> shown as "did not run".
        run: |
          {
            echo "### plugin-ci"
            echo ""
            echo "| Gate | Status |"
            echo "| --- | --- |"
            echo "| py_compile (MCP + scripts) | ${{ steps.py_compile.outcome || 'did not run' }} |"
            echo "| pty-capture smoke (--timeout) | ${{ steps.pty_smoke.outcome || 'did not run' }} |"
            echo "| unittest discover (synthesizer suite) | ${{ steps.mcp_tests.outcome || 'did not run' }} |"
            echo "| unittest discover (scripts suite) | ${{ steps.scripts_tests.outcome || 'did not run' }} |"
            echo "| ungated plugin-state entry guard (COREDEV-2691) | ${{ steps.seam_ungated.outcome || 'did not run' }} |"
            echo "| version-sync (strict) | ${{ steps.version_sync.outcome || 'did not run' }} |"
            echo "| plugin-assembly (strict) | ${{ steps.plugin_assembly.outcome || 'did not run' }} |"
            echo "| claude plugin validate (marketplace + deep) | ${{ steps.claude_validate.outcome || 'did not run' }} |"
            echo "| whitespace (git diff --check) | ${{ steps.whitespace.outcome || 'did not run' }} |"
            echo "| shellcheck (-S warning) | ${{ steps.shellcheck_gate.outcome || 'did not run' }} |"
            echo "| actionlint | ${{ steps.actionlint_gate.outcome || 'did not run' }} |"
            echo "| hooks-manifest (strict) | ${{ steps.hooks_manifest.outcome || 'did not run' }} |"
            echo "| hook stdin-simulation tests | ${{ steps.hook_tests.outcome || 'did not run' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  py39-smoke:
    # macOS ships Python 3.9.6 as /usr/bin/python3, and the review CLIs run the plugin's scripts under
    # it. The main `validate` job uses 3.12, where a PEP-604 `X | None` annotation in a runtime-evaluated
    # position is legal — so it did NOT catch pty-capture.py crashing on 3.9.6 (COREDEV-2494). This job
    # byte-compiles the load-bearing scripts on 3.9 (which is exactly what fails on such a syntax error)
    # and runs the pty-capture smoke test, so the target-runtime regression cannot recur unseen.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.9 (the macOS stock runtime)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'
      - name: Byte-compile load-bearing scripts on 3.9 (catches PEP-604 / match / walrus regressions)
        run: python3 -m py_compile mcp/review-synthesizer/*.py scripts/lib/bash-write-scan.py scripts/pty-capture.py scripts/review-verdict.py scripts/review/bind-prompt.py scripts/review/callers_scan.py scripts/review/cleanup_coredev_2619_leaks.py scripts/review/containment.py scripts/review/generate-callers-exemptions.py scripts/review/snapshot-operands.py scripts/review/stage-bound-plan.py scripts/review/stage-prompt.py scripts/validate-hooks.py scripts/validate-plan-citations.py scripts/validate-plugin-assembly.py
      - name: bind-prompt.py real invocation on 3.9
        # bind-prompt.py runs inside the BLOCKING plan-review gate on macOS stock 3.9, and byte-compile
        # cannot catch a runtime-evaluated union or an fd-API mismatch (PR #63 recheck, P3 — the same
        # reasoning that earned bash-write-scan its 3.9 exec smoke). Drive a REAL bind (a git repo, a
        # prompt naming the plan, a transcript) plus a refusal, so a 3.9 regression surfaces here.
        run: |
          set -euo pipefail
          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          cd "$work"
          git init -q .; git config user.email c@i; git config user.name ci
          mkdir -p docs/planning
          printf '# Plan\ncontent\n' > docs/planning/X_PLAN.md
          printf 'Review the plan for correctness and completeness.\n%.0s' {1..40} > .prompt.md
          printf 'REVIEW TARGET: docs/planning/X_PLAN.md\n' >> .prompt.md
          git add -A; git commit -qm init
          t="$work/t.txt"
          python3 "$GITHUB_WORKSPACE/scripts/review/bind-prompt.py" \
            --prompt .prompt.md --transcript "$t" --plan docs/planning/X_PLAN.md
          # `if`, not `A && B || C`: shellcheck flags that as SC2015 (info) and actionlint promotes
          # any shellcheck finding to a failure, so the chained form failed CI while passing a local
          # `actionlint` whose shellcheck did not report info-level issues.
          if [ ! -s "$t.plan" ] || [ ! -s "$t.planbytes" ] || [ ! -s "$t.prompt" ]; then
            echo "bind-prompt did not write its sidecars on 3.9" >&2
            exit 1
          fi
          # And a prompt naming a DIFFERENT plan must be refused (the binding is enforced, not cosmetic).
          printf 'Review it.\n%.0s' {1..40} > .bad.md
          printf 'REVIEW TARGET: docs/planning/OTHER_PLAN.md\n' >> .bad.md
          status=0
          python3 "$GITHUB_WORKSPACE/scripts/review/bind-prompt.py" \
            --prompt .bad.md --transcript "$work/t2.txt" --plan docs/planning/X_PLAN.md >/dev/null 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "bind-prompt accepted a prompt naming a different plan on 3.9" >&2
            exit 1
          fi
      - name: generate-callers-exemptions.py produces the shipped manifest on 3.9
        # Added this PR and previously uncovered by CI (PR #63 recheck, P3). It regenerates the
        # exemption manifest the callers scan depends on, and it runs on macOS stock 3.9 — run it and
        # assert it leaves the committed manifest unchanged, so a drift or a 3.9 regression fails here.
        run: |
          set -euo pipefail
          python3 scripts/review/generate-callers-exemptions.py
          if ! git diff --exit-code -- scripts/review/callers-scan-exemptions.tsv; then
            echo "generate-callers-exemptions.py output drifted from the committed manifest" >&2
            exit 1
          fi
      - name: callers_scan.py execution smoke on 3.9
        run: python3 scripts/review/callers_scan.py --help >/dev/null
      - name: callers_scan.py real invocation on 3.9
        # `--help` never loads the manifest or reads the tree, so it stayed green for the whole of
        # PR #63 while the production invocation exited 2 on an ABSENT exemption manifest — the
        # scanner could not scan at all and nothing said so (PR #63 review, thread 5). Run the real
        # thing: this is the only step that would have caught it.
        run: python3 scripts/review/callers_scan.py --root .
      - name: cleanup tool refuses without --apply on 3.9
        # Its ONLY real execution is destructive and happens on macOS stock 3.9, so 3.9 must at least
        # prove it parses and still fail-closes without the acknowledgement (PR #63 review, gap 29).
        run: |
          # GitHub Actions runs `run:` under `bash -eo pipefail`, so a bare non-zero command ABORTS
          # the step before the next line executes. Capturing an EXPECTED failure therefore needs
          # `|| status=$?`, which suppresses -e; `status=$?` on the following line never runs.
          status=0
          python3 scripts/review/cleanup_coredev_2619_leaks.py --state-root /nonexistent-state-root >/dev/null 2>&1 || status=$?
          [ "$status" -eq 2 ] || { echo "expected refusal exit 2 without --apply, got $status"; exit 1; }
      - name: bash-write-scan.py execution smoke on 3.9 (byte-compile can't catch a runtime-evaluated union)
        # MIN-2: bash-write-scan.py runs inside the BLOCKING PreToolUse sensitive-file guard on macOS's
        # stock 3.9. A PEP-604 `X | None` in a def signature byte-compiles fine on 3.9 and only raises
        # TypeError at import — so exercise the module, not just compile it (`|| return 2` in the guard
        # turns such an import crash into a hard deny of every Bash tool call).
        run: |
          set -euo pipefail
          out="$(printf 'echo hi > Keychain.swift' | python3 scripts/lib/bash-write-scan.py)"
          printf '%s\n' "$out" | grep -q 'Keychain.swift' || { echo "3.9 bash-write-scan did not emit target"; exit 1; }
      - name: pty-capture.py smoke test on 3.9 (the exact file that regressed)
        run: |
          set -euo pipefail
          out="$(mktemp)"
          python3 scripts/pty-capture.py "$out" -- echo ok
          grep -q "ok" "$out" || { echo "3.9 capture missing"; exit 1; }
          test -s "$out.captureid" || { echo "3.9 capture-id sidecar missing"; exit 1; }
          # Session-safety (#44 review §4): the transcript + sidecar must be 0600, and a pre-existing
          # symlink at the output path must be REFUSED (not written through).
          test "$(stat -c '%a' "$out")" = "600" || { echo "capture not 0600"; stat -c '%a' "$out"; exit 1; }
          victim="$(mktemp)"; link="$(mktemp -u)"; ln -s "$victim" "$link"
          python3 scripts/pty-capture.py "$link" -- echo pwned || true
          test ! -s "$victim" || { echo "capture wrote THROUGH a symlink"; exit 1; }
          echo "pty-capture on 3.9: capture + capture-id + 0600 + symlink-refusal OK"

  linux-primitive-probe:
    # COREDEV-2617 — MEASURE §4.2a-P's Linux arms rather than writing them from documentation.
    # Two independent plan reviewers concurrently found that §4.2a-S plus §4.2a-P cannot be
    # implemented on Linux: P-2's Linux format, ACL-3's `getfacl` grammar and P-4's behaviour under a
    # POSIX default ACL are all unexecuted, because the development machine is Darwin. Every defect
    # P-2 has had came from a format written from documentation — decimal where the other arm gave
    # octal, then a stripped setuid bit, then the symlink measured instead of the target. This job
    # prints what the primitives actually return so the plan can record measurements. It asserts
    # nothing and gates nothing: `continue-on-error` keeps a missing tool from turning CI red, since
    # its output is read by a human, not by an oracle.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install acl tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq acl zsh
      - name: Probe the Linux primitives
        run: bash scripts/review/linux-primitive-probe.sh

  load-check:
    # COREDEV-2598 — prove the plugin LOADS, not merely that it validates. `claude plugin validate
    # --strict .` is schema validation and cannot see load-layer breakage. The whole recipe, the
    # reasons it deviates from the upstream it adopts, and the executed mutant->assertion mapping
    # live in the script's header — deliberately, so they are next to the code they justify.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node (for the pinned Claude Code CLI)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install the PINNED Claude Code CLI
        env:
          # MUST match the `validate` job's pin — a load check on a different CLI than the one that
          # validates proves less than it appears to. That job scopes CLAUDE_CODE_VERSION to a single
          # STEP, so `${{ env.CLAUDE_CODE_VERSION }}` is EMPTY here; the value is repeated instead and
          # `scripts/tests/test_shell_primitive_drift.py` asserts the two pins agree.
          CLAUDE_CODE_VERSION: 2.1.220
        run: |
          set -euo pipefail
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
      - name: Load check (scratch marketplace, per-run sentinel, MCP handshake)
        run: bash scripts/ci-load-check.sh

  redactor-equivalence:
    # COREDEV-2597 §4.5 — the MECHANICAL closure of the shell/Python redactor equivalence.
    #
    # The two redactors (`scripts/lib/hook-io.sh::hook_redact_pii` and
    # `mcp/review-synthesizer/capture.py::redact_pii`) must agree byte-for-byte except for ONE
    # documented exemption. A static fixture table cannot gate that: three of the nine known
    # divergence root causes have UNBOUNDED generators, which is why two successive plan-review
    # rounds each found more divergences than the previous enumeration claimed existed. So the gate
    # is an equivalence over a seeded corpus, asserting UNEXPLAINED == 0.
    #
    # RUNS ON BOTH RUNNERS ON PURPOSE. `sed`/`tr` differ between BSD (developer macOS) and GNU
    # (Ubuntu), and one root cause — `tr` aborting on invalid UTF-8 outside `LC_ALL=C`, which
    # TRUNCATES the message — literally inverts by platform: green on GNU, red on BSD. A
    # single-platform run is half a result, and the half that passes is the half that hides it.
    # macOS RUNS ON PUSH TO `main` ONLY — not on pull requests, and not on `alpha`.
    #
    # WHY IT IS RESTRICTED. A macOS runner bills at 10x the Linux rate, and this leg measured 10m30s
    # against 2m35s for the ubuntu one, so it was ~105 Linux-equivalent minutes on EVERY push. The
    # matrix is computed rather than filtered with a step-level `if:`, because an `if:` still
    # provisions the runner and starts the meter.
    #
    # WHAT THAT COSTS, stated plainly: this is now a POST-MERGE CANARY, not a gate. The comment below
    # is still true — the `tr`-on-invalid-UTF-8 root cause inverts by platform, green on GNU and red on
    # BSD — so a BSD-only defect now LANDS on main and is caught after the fact rather than blocked
    # before it. `redactor-equivalence (macos-latest)` was removed from the required checks at the same
    # time, because a context that PR commits no longer produce would make every PR unmergeable.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    # Raised from 10. This PR added the scripts suite + hook harness to the macOS leg, and the
    # measured run is 7m49s — 78% of a 10-minute cap, on the most variable runner GitHub offers.
    # A cap that close to the observed time turns a slow runner into a red build that says
    # nothing about the code (PR #63 second-round review).
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report the sed/tr implementation under test
        # Recorded so a red run can be attributed to the engine rather than to the patterns.
        run: |
          set -uo pipefail
          echo "os: ${{ matrix.os }}"
          sed --version 2>/dev/null | head -1 || echo "sed: BSD (no --version)"
          tr --version 2>/dev/null | head -1 || echo "tr: BSD (no --version)"
      - name: Redactor parity fixture (both implementations, single canonical vector list)
        run: python3 -m unittest discover -s mcp/review-synthesizer/tests -p test_redactor_parity.py -v
      - name: Equivalence over a seeded corpus — UNEXPLAINED must be 0
        # The seed is FIXED so a red run is reproducible and bisectable. Do not randomise it.
        run: python3 mcp/review-synthesizer/redactor_model.py --count 40000 --seed 20260729
      - name: Second seed (the same invariant, a disjoint corpus)
        run: python3 mcp/review-synthesizer/redactor_model.py --count 20000 --seed 31337

      # macOS ONLY. The `validate` job already runs these on ubuntu; duplicating them here would just
      # burn minutes. What macOS adds is the PLATFORM: the agent fence runs zsh on developer macOS,
      # `sed`/`tr` are BSD rather than GNU, and the filesystem is case-INSENSITIVE by default -- so a
      # shell or path-classification defect can be green on ubuntu and red here. Before this the macOS
      # leg ran only the redactor suite, so nothing platform-specific in the scripts suite or the hook
      # harness was ever exercised on the platform it targets (PR #63 review, gap 15).
      - name: Run the scripts test suite (macOS platform coverage)
        if: matrix.os == 'macos-latest'
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Run the hook stdin-contract harness (macOS platform coverage)
        if: matrix.os == 'macos-latest'
        run: bash scripts/test-hooks.sh

  secret-scan:
    # History-aware secret scan (COREDEV-2486 / audit critic.1). Prevents a recurrence of the
    # accidental-commit class that leaked firebase-debug.log. History is NOT rewritten; the one
    # accepted historical exposure is allowlisted in .gitleaks.toml (see SECURITY.md).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history — history-aware scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history for secrets
        # .gitleaks.toml exempts ONLY the accepted historical exposure; any other secret fails.
        run: gitleaks git --no-banner --redact --config .gitleaks.toml --exit-code 1 .

      - name: Job summary
        if: ${{ always() }}
        run: |
          {
            echo "### secret-scan"
            echo ""
            echo "| Gate | Status |"
            echo "| --- | --- |"
            echo "| gitleaks (full history) | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
