# Keeps the SHA-pinned GitHub Actions current (AGENT_CONTRACTS.md §6 pins by commit SHA;
# Dependabot updates the pin in place and preserves the ` # vX.Y.Z` tag comment).
# COREDEV-2488 (audit critic.5). The bundled review-synthesizer MCP is stdlib-only, so there
# is no pip/npm ecosystem to track.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Version updates open against alpha: the branch flow is main > alpha > feature work
    # (COREDEV-2883). GitHub always opens SECURITY updates against the default branch (main), and
    # once target-branch is set the options below apply to version updates only. Dependabot reads
    # this file from the default branch, so the setting takes effect when alpha is promoted to main.
    target-branch: alpha
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
