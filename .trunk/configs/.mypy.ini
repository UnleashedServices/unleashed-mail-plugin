# Aggressive mypy config for the unleashed-mail plugin repo.
#
# python_version mirrors the CI floor: the plugin-ci `py39` job byte-compiles the
# load-bearing scripts on Python 3.9 (the macOS stock runtime). Type-checking at 3.9
# makes mypy reject 3.10+ constructs at lint time rather than in CI.
#
# Trunk always invokes mypy with --ignore-missing-imports --follow-imports=silent
# --show-error-codes --show-column-numbers --no-incremental, so those are not repeated here.
[mypy]
python_version = 3.9

# MODULE NAMING -- load-bearing, and the reason the two test sections below used to be dead.
# Without these, mypy derives a module name from the file's BASENAME whenever the directory chain
# has no __init__.py: `scripts/tests/test_freshness.py` becomes module `test_freshness`, and a
# `[mypy-scripts.tests.*]` section can therefore never match it. mypy does say so -- it prints
# `note: unused section(s): ...` -- but that one line is easy to lose in a 2,000-line report, and
# the exemption silently is not granted. This is the same shape as the `--ini` trap documented in
# .bandit: a config that parses, honours nothing, and reports no error.
# With these three, the module name is the path relative to the repo root instead.
explicit_package_bases = True
namespace_packages = True
mypy_path = .

# The strict bundle, spelled out rather than `strict = True` so each knob can be
# relaxed individually as the backlog is worked down.
warn_unused_configs = True
disallow_any_generics = True
disallow_subclassing_any = True
# DELIBERATELY OFF -- for backlog control, NOT because it is redundant.
# `no-untyped-call` reports TYPED CALLERS crossing into untyped code; `disallow_untyped_defs`
# below reports the unannotated definitions themselves. They are documented as distinct
# controls, and an earlier revision of this file wrongly called the former "the same
# definitions counted a second time". Disabling it means new typed code may call pre-existing
# untyped functions with no diagnostic -- a real loss, accepted so the ~350 findings that are
# actual type BUGS (attr-defined, union-attr, arg-type, possibly-undefined) stay visible during
# rollout rather than being buried under 2,906 call-site reports.
# mypy's `untyped_calls_exclude` can re-enable it while exempting named legacy modules; that is
# the intended end state.
disallow_untyped_calls = False
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True

# Beyond strict: these catch dead code and silent narrowing bugs.
warn_unreachable = True
extra_checks = True

# A blanket `# type: ignore` hides the next regression as well as this one.
enable_error_code = ignore-without-code, redundant-expr, truthy-bool, possibly-undefined

# Test suites are exempt from the annotation mandate only -- every correctness check
# above still applies to them.
[mypy-scripts.tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False

# `mcp/review-synthesizer/` contains a HYPHEN, which is not a legal Python module component, so
# mypy cannot build a dotted name for these five files and falls back to the basename even with
# explicit_package_bases above. They are listed here under the names mypy actually assigns. Do not
# "simplify" this to a wildcard: mypy accepts a partial-name pattern like `[mypy-test_*]` and even
# stops reporting it as unused, but it does NOT apply the options -- measured, 39 errors before and
# 39 after, versus 20 with the names spelled out. The `unused section(s)` note is the check.
[mypy-test_capture,test_mcp_server,test_redactor_parity,test_schema,test_synthesize]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
