# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    # --- security ---------------------------------------------------------------
    - zizmor@1.29.0 # GitHub Actions static analysis (auditor persona, see definitions)
    - gitleaks@8.30.1
    - trufflehog@3.96.0
    - bandit@1.9.4
    - checkov@3.3.11
    # --- correctness ------------------------------------------------------------
    - mypy@2.3.1 # static types for the 66 Python files; pinned to py39, the CI floor
    - ruff@0.16.3
    - shellcheck@0.11.0
    - actionlint@1.7.12
    - pinact@4.1.1 # keeps CI actions SHA-pinned (AGENT_CONTRACTS.md §6)
    - git-diff-check
    # --- docs -------------------------------------------------------------------
    - markdownlint@0.49.1
    - markdown-link-check@3.15.0 # the automated half of the cross-reference check
    - codespell@2.4.3
    # --- formatting -------------------------------------------------------------
    - black@26.5.1
    - isort@8.0.1
    - prettier@3.9.6
    - shfmt@3.13.1
    - taplo@0.10.0
    - yamllint@1.38.0

  definitions:
    # zizmor's default `regular` persona minimises false positives. This repo would rather
    # see everything and suppress case by case in .github/zizmor.yml, so run the most
    # aggressive persona. `auditor` explicitly accepts false positives.
    - name: zizmor
      commands:
        - name: lint
          output: sarif
          run: zizmor --persona=auditor --format=sarif ${target}
          success_codes: [0]
          batch: true
          cache_results: true
          is_security: true

    # Trunk invokes `gitleaks detect --no-git --source=<target>` with NO --config flag, and
    # scans a sandboxed COPY of the targets -- so the repo's carefully tuned .gitleaks.toml
    # (the one CI's history-aware scan uses) was never being read, and its allowlists for the
    # redactor's synthetic fixture corpus never applied. Point gitleaks at the real file.
    - name: gitleaks
      environment:
        - name: GITLEAKS_CONFIG
          value: ${workspace}/.gitleaks.toml

    # Trunk invokes markdown-link-check with no -c, so it had no config at all: no retry on
    # 429, no timeout, and no way to exempt the deliberate cross-repo links into the sibling
    # app repo. Pass the config explicitly.
    - name: markdown-link-check
      commands:
        - name: lint
          output: sarif
          run:
            markdown-link-check -q -c "${workspace}/.trunk/configs/markdown-link-check.json"
            "${target}"
          success_codes: [0, 1]
          cache_results: false
          read_output_from: stdout
          parser:
            runtime: python
            run: python3 ${plugin}/linters/markdown-link-check/parse.py --target="${target}"

  ignore:
    # COREDEV-2780 — DOCUMENTS WHOSE BYTES ARE BOUND TO A REVIEW VERDICT ARE NOT FORMATTED.
    #
    # `scripts/review-verdict.py` binds an approving plan-review verdict to the plan's exact SHA-256
    # and refuses to verify if one byte moves ("approve-then-edit is blocked"). A formatter reflowing
    # the document INVALIDATES A GENUINE APPROVAL — the plan must then be re-reviewed, two arms and
    # about an hour a round, to buy back nothing but line wrapping.
    #
    # Found the hard way while wiring M5a's own gate: `trunk fmt` rewrote a plan that was GATED at the
    # time. The local gate and the plan-review gate were, for that moment, demanding incompatible
    # things. Deliberately narrow — only `*_PLAN.md` under docs/planning/, the shape review-verdict.py
    # binds — and only the two linters that reflow prose. Everything else still lints these files.
    - linters:
        - markdownlint
        - prettier
      paths:
        - docs/planning/*_PLAN.md
    # trufflehog on the test corpora: all 26 findings were synthetic secret-shaped strings that
    # tests need in order to assert redaction/parsing. Scoped by PATH and by LINTER, so every
    # detector -- Lob included -- stays live everywhere else in the repo.
    - linters: [trufflehog]
      paths:
        - scripts/tests/**
        - mcp/review-synthesizer/tests/**
    # COREDEV-2780 M5a — bandit on TEST code, by the same mechanism and the same paths this
    # repository already uses for trufflehog above (maintainer-approved 2026-09-02).
    #
    # bandit: B603/B607 flag `subprocess` with a partial path, which is what every harness here does
    # deliberately -- these suites EXECUTE the shipped scripts rather than re-implementing them, and
    # that is the property several cells depend on.
    #
    # MYPY WAS HERE AND HAS BEEN REMOVED, because the reason given for it was false. It read "there
    # is NO mypy configuration in this repository at all -- no mypy.ini ... and .trunk/configs holds
    # only ruff.toml". `.trunk/configs/.mypy.ini` is 74 tracked lines, and the commit that added it
    # (`3b18ea3 fix(COREDEV-2771): the mypy test exemption was inert`) exists precisely because its
    # test sections were not matching. Turning the linter off wholesale here reversed that fix and
    # took the CORRECTNESS checks with it -- it was hiding a real `union-attr` defect in the contract
    # checker. The narrow exemption now lives in `.mypy.ini`, per error code, where it can exempt the
    # annotation noise without exempting correctness.
    #
    # DELIBERATELY NARROW: one linter, test paths only. Production code under scripts/ still gets it.
    # Widening this again is a reviewed change -- cell 4 freezes this list as a literal.
    - linters: [bandit]
      paths:
        - scripts/tests/**
        - mcp/review-synthesizer/tests/**
    # LOCAL-ONLY TREES, NAMED EXACTLY. `.claude/**` and `.trunk/**` were far too wide: between them
    # they hold TWELVE TRACKED files, and trunk reported the damage itself -- `.trunk/trunk.yaml`,
    # the file that DEFINES this gate, was ignored for gitleaks, trufflehog, checkov, codespell,
    # git-diff-check, prettier and yamllint, and all nine tracked linter configs plus
    # `.claude/settings.json` likewise. Turning off SECRET SCANNING on a repository's own config
    # surface is not what "local-only state" was meant to say.
    #
    # The subdirectories below are the genuinely generated ones -- trunk's own `.trunk/.gitignore`
    # enumerates them -- plus the git worktrees under `.claude/`. Anything tracked is linted again.
    - linters: [ALL]
      paths:
        - .claude/worktrees/**
        - .trunk/out/**
        - .trunk/logs/**
        - .trunk/actions/**
        - .trunk/notifications/**
        - .trunk/tools/**
        - .trunk/plugins/**
        - .trunk/tmp/**
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
