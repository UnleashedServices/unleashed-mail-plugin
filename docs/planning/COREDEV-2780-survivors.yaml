  - id: survivor/workflow-dispatch-if-guard
    # THE CONCRETE CASES, not the clause. Naming only `C6` let the specific case be
    # deleted while six siblings kept the clause present, so the binding permitted exactly
    # the regression it claimed to detect (codex, PR #85).
    covered_by:
      - C1.single-event/add-workflow-dispatch
      - C3.nothing-skips-or-masks/job-if
    found_in_round: r5
    survived_formulation: >-
      Revision 4 replaced the job-level `on:` with `if: github.event_name != 'workflow_dispatch'`, and
      cell 11 asserted the literal `if:`.
    mutant: a job carrying that exact `if:` guard
    would_have_shipped: >-
      A BYPASS the cell would have CERTIFIED. GitHub's own troubleshooting documentation states that
      when a job is skipped by a conditional, the job reports "Success" — and a required context is
      satisfied by that success. Dispatching at an internal PR's head branch would attach a
      successful, skipped `trunk-check` to that SHA with Trunk never running.
    must_fail_because: C1 permits no `workflow_dispatch` trigger and C3 permits no job-level `if:`.

