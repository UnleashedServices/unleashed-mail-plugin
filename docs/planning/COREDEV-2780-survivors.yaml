    # the strongest form a survivor can take, and precisely why it must be stated.
    backed_by: shape-removed
    found_in_round: r38
    survived_formulation: >-
      Cell 15 asserted that a spy on `resolve()` was REACHED from both entry points, then that an
      entry-distinct sentinel GOVERNED each result.
    mutant: >-
      one public `resolve()` wrapper dispatching to two private per-entry resolvers, both currently
      correct
    would_have_shipped: >-
      Two resolution paths free to DRIFT on the next edit. It passes the sentinel test — substituting
      the wrapper's return bypasses both private paths — and passes every family case, because both
      privates agree today. Each earlier encoding asserted a property ABOUT the implementation, and
      any such property is satisfiable by an implementation that is currently correct.
    must_fail_because: >-
      `resolve(ref_name, default_branch)` is ENTRY-AGNOSTIC — it takes no entry id and no
      entry-derived argument, so there is nothing to dispatch on and the per-entry private resolver
      CANNOT BE WRITTEN. The shape is removed rather than asserted about.

