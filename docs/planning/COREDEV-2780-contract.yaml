# COREDEV-2780 — the trunk-check contract, as a STRUCTURED REGISTRY.
#
# This file is the AUTHORITY. §1's C0–C9 and C6a prose is RENDERED from it (cell 15 fails if the two
# disagree), and cell 11 GENERATES one mutant per mutation CASE by iterating `cases`, never by reading
# the prose. Revision 13 of the plan said the mutants were "derived from the clause text", which is not
# a mechanism when the clause text is unrestricted prose: nothing can parse it, and a hand-written
# mutant list checked against hand-written names just moves the drift up one level. With a structured
# source there is nothing to parse and nothing to keep in step — adding an obligation here
# automatically produces its mutant.
#
# WHY THE KINDS EXIST. A flat (id, path, required|prohibited, value) schema covers ordinary workflow
# keys and nothing else, so C6's repository fixtures, C2's live-remote comparison and C8's digest
# semantics would each have silently received a YAML-shaped mutant or none — under-coverage BY
# CONSTRUCTION, which is what this registry abolishes.
#
# WHY CASES ARE FIRST-CLASS. One mutant per ENTRY still under-covers: C1 must both add a trigger and
# remove a required one; C2 must diverge the local side and the remote side separately; C8's three run
# steps need four forms each. The generator iterates CASES.
#
# Every case declares: `op` and `side`, its `target`, its `payload` or `fixture`, a `validity` check
# (the mutant must be CONSTRUCTIBLE and must change the intended property), and its OWN `diagnostic`.
# A case that fails through a sibling clause's message proves reachability, not discrimination.

schemaVersion: 1
ticket: COREDEV-2780
renders: docs/planning/COREDEV-2780_REPO_GATING_HYGIENE_PLAN.md#§1
action_pin: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa
# The canonicalised `with:` block the shipped required workflow passes to that action, frozen. The
# harness binds its own extraction to this, and the parity judge requires a recorded artifact to
# carry it — so evidence generated for DIFFERENT inputs cannot certify the current invocation.
# ONE copy: this module already refuses a second copy of `action_pin` for the same reason.
action_inputs_digest: cc125ae649d85ba092aa5a92fe187df6d4d235e896a8b17a267b7f1e6a77cd36

# ---------------------------------------------------------------------------------------------
# The two workflows this contract governs. Cell 11 runs each obligation against the entries listed
# in its `entries:` field; a family reference expands as (entry_id, family_case_id).
# ---------------------------------------------------------------------------------------------
entries:
  required:
    id: required
    path: .github/workflows/trunk-check.yml
    job: trunk-check
    context: trunk-check
    required_context: true
  canary:
    id: canary
    path: .github/workflows/trunk-check-push.yml
    job: trunk-check-push
    context: trunk-check-push
    required_context: false

# ---------------------------------------------------------------------------------------------
# FAMILIES — declared ONCE and referenced by entry id, never inlined into each entry.
# ---------------------------------------------------------------------------------------------
families:
  target_set_resolution:
    kind: remote_relation
    statement: >-
      A workflow's `branches:` must equal the ruleset's RESOLVED target set:
      resolve(ref_name) = {expand each include} MINUS {expand each exclude}, where expansion maps
      ~DEFAULT_BRANCH to the repository's current default_branch, strips a refs/heads/ prefix, and
      FAILS CLOSED on ~ALL or any fnmatch metacharacter (* ? [).
    implementation:
      # THE SIGNATURE IS THE ENFORCEMENT. `resolve` takes no entry id and no entry-derived argument,
      # so there is nothing to dispatch on and a per-entry private resolver cannot be written behind
      # it. Resolution happens ONCE, before entry selection; the single result is passed into both
      # entry comparisons. Cell 15 substitutes one shared sentinel at that boundary.
      function: resolve(ref_name, default_branch)
      entry_agnostic: true
      resolved_once_before_entry_selection: true
    applies_to:
      [
        C2.branches-equal-resolved-target-set,
        C16.canary-branches-equal-resolved-target-set,
      ]
    # 2 sides x 6 forms = 12 cases; referenced by 2 entries = 24 executions.
    sides: [include, exclude]
    forms:
      - id: literal
        expect: equality
        payload: refs/heads/alpha
      - id: default_branch
        expect: equality
        payload: ~DEFAULT_BRANCH
      - id: all_alias
        expect: refusal
        payload: ~ALL
      - id: star
        expect: refusal
        payload: refs/heads/a*
      - id: question
        expect: refusal
        payload: refs/heads/mai?
      - id: bracket
        expect: refusal
        payload: refs/heads/mai[a-z]
    validity: >-
      The mutant mutates an INJECTED ruleset observation, never the live ruleset. `equality` forms
      must produce a resolved set differing from the workflow's branches; `refusal` forms must produce
      the resolver's fail-closed error, and the two diagnostics must be DISTINGUISHABLE or a
      literalising resolver survives behind a shared message.
    diagnostics:
      equality: "target set mismatch: workflow branches != resolved ruleset target set"
      refusal: "target set unresolvable: refusing to compare an unenumerable pattern"

obligations:
  # ------------------------------------------------------------------ C0: workflow root ----------
  - id: C0.root-mapping-allowlist
    clause: C0
    kind: yaml
    entries: [required, canary]
    statement: The workflow ROOT mapping admits only `name`, `on`, `permissions`, `jobs`.
    target: $
    cases:
      - id: C0.root-mapping-allowlist/arbitrary-key
        op: add
        side: local
        target: $.schedule
        payload: "cron: '0 0 * * *'"
        validity: a valid workflow root key outside the allowlist, so a blacklist detector passes it
        diagnostic: "root mapping: unlisted key `schedule`"

  - id: C0.permissions-pinned-at-root
    clause: C0
    kind: yaml
    entries: [required, canary]
    statement: "`permissions:` at the ROOT is exactly `contents: read`."
    target: $.permissions
    cases:
      - id: C0.permissions-pinned-at-root/write-all
        op: set
        side: local
        target: $.permissions
        payload: write-all
        validity: a wider token that produces byte-identical runtime evidence, so only a static check kills it
        diagnostic: "root permissions: expected `contents: read`, found `write-all`"
      - id: C0.permissions-pinned-at-root/widened-scope
        op: set
        side: local
        target: $.permissions
        payload: "{contents: read, checks: write}"
        validity: a single widened scope, which the value pin must reject as surely as write-all
        diagnostic: "root permissions: expected `contents: read`, found an extra scope"
      - id: C0.permissions-pinned-at-root/absent
        op: remove
        side: local
        target: $.permissions
        validity: "absence inherits the repository default, which is not `contents: read`"
        diagnostic: "root permissions: key is absent"

  - id: C0.no-concurrency
    clause: C0
    kind: yaml
    entries: [required, canary]
    statement: >-
      `concurrency` is prohibited at workflow AND job level. A constant group makes GitHub CANCEL the
      in-flight run when a new one starts, and a cancelled required check is not a passing one.
    target: $.concurrency, $.jobs.*.concurrency
    cases:
      - id: C0.no-concurrency/workflow
        op: add
        side: local
        target: $.concurrency
        payload: "group: trunk-check"
        validity: constructible and valid YAML; reproduces the cancellation hazard
        diagnostic: workflow-level `concurrency` is prohibited
      - id: C0.no-concurrency/job
        op: add
        side: local
        target: $.jobs.<job>.concurrency
        payload: "group: trunk-check"
        validity: the level-below site revision 21 left open when it converted the job mapping
        diagnostic: job-level `concurrency` is prohibited
  # ------------------------------------------------------------------ C1: the event --------------
  - id: C1.single-event
    clause: C1
    kind: yaml
    entries: [required]
    statement: "`on:` contains `pull_request` ONLY — no `workflow_dispatch`, which the pinned action maps to check-mode=all."
    target: $.on
    cases:
      - id: C1.single-event/add-push
        op: add
        side: local
        target: $.on.push
        payload: "branches: [main, alpha]"
        validity: a second event that would emit the same context from a narrower range
        diagnostic: "event set: unlisted event `push`"
      - id: C1.single-event/add-workflow-dispatch
        op: add
        side: local
        target: $.on.workflow_dispatch
        payload: "{}"
        validity: the seventh hazard; dispatch autodetects check-mode=all at the pinned SHA
        diagnostic: "event set: unlisted event `workflow_dispatch`"
      - id: C1.single-event/remove-pull-request
        op: remove
        side: local
        target: $.on.pull_request
        validity: omission, whose failure mode a presence-only validator misses
        diagnostic: "event set: `pull_request` is absent"
      - id: C1.single-event/arbitrary-event
        op: add
        side: local
        target: $.on.schedule
        payload: "- cron: '0 0 * * *'"
        validity: a valid unlisted event, so a blacklist of known-bad events passes it
        diagnostic: "event set: unlisted event `schedule`"

  - id: C1.event-option-allowlist
    clause: C1
    kind: yaml
    entries: [required]
    statement: >-
      Within `pull_request`, ONLY `branches:` and `types:`. The distinction is not "no activity
      filters" but no filter that NARROWS reachability.
    target: $.on.pull_request
    cases:
      - id: C1.event-option-allowlist/paths
        op: add
        side: local
        target: $.on.pull_request.paths
        payload: "['**.py']"
        validity: >-
          A real, valid `pull_request` option that NARROWS. (`tags:` was retired as unconstructible:
          it is not a valid pull_request option at all, so its mutant failed schema validation rather
          than contract validation — the very defect it was written to replace.)
        diagnostic: "pull_request options: `paths` narrows reachability"
      - id: C1.event-option-allowlist/paths-ignore
        op: add
        side: local
        target: $.on.pull_request.paths-ignore
        payload: "['docs/**']"
        validity: the sibling narrowing filter; leaves a required context Pending, which blocks
        diagnostic: "pull_request options: `paths-ignore` narrows reachability"
      - id: C1.event-option-allowlist/arbitrary-option
        op: add
        side: local
        target: $.on.pull_request.branches-ignore
        payload: "['wip/**']"
        validity: a valid unlisted mapping option
        diagnostic: "pull_request options: unlisted option `branches-ignore`"

  # ------------------------------------------------------------------ C2: branches + types -------
  - id: C2.branches-equal-resolved-target-set
    clause: C2
    kind: remote_relation
    entries: [required]
    statement: "`branches:` equals the ruleset's RESOLVED target set."
    family: target_set_resolution
    cases:
      - id: C2.branches-equal-resolved-target-set/absent
        op: remove
        side: local
        target: $.on.pull_request.branches
        validity: omission; a PR into an ungated base would then require a context nothing produces
        diagnostic: "branches: key is absent"
      - id: C2.branches-equal-resolved-target-set/local-divergence
        op: set
        side: local
        target: $.on.pull_request.branches
        payload: "[main]"
        validity: the LOCAL half of the relation, diverged while the remote is untouched
        diagnostic: "target set mismatch: workflow branches != resolved ruleset target set"

  - id: C2.types-required
    clause: C2
    kind: yaml
    entries: [required]
    statement: >-
      `types: [opened, synchronize, reopened, edited]`. The default set EXCLUDES `edited`, the event a
      retarget fires, so without it a retargeted PR keeps a green check computed against the OLD base.
    target: $.on.pull_request.types
    cases:
      - id: C2.types-required/reduced-to-default
        op: set
        side: local
        target: $.on.pull_request.types
        payload: "[opened, synchronize, reopened]"
        validity: reintroduces the stale-base pass; a value check catches this one
        diagnostic: "types: `edited` is missing from the activity set"
      - id: C2.types-required/removed
        op: remove
        side: local
        target: $.on.pull_request.types
        validity: >-
          Its failure mode is OMISSION. A validator that checks the value only when the key is present
          rejects the reduced-set mutant while ACCEPTING an absent one — both cases are required.
        diagnostic: "types: key is absent"

  # ------------------------------------------------------------------ C3: the job ----------------
  - id: C3.job-mapping-allowlist
    clause: C3
    kind: yaml
    entries: [required, canary]
    statement: >-
      The job's keys are `runs-on`, `timeout-minutes`, `permissions`, `steps`, and optionally `name`
      (cell 14's effective check name, which takes precedence over the job id when present).
    target: $.jobs.<job>
    cases:
      - id: C3.job-mapping-allowlist/arbitrary-key
        op: add
        side: local
        target: $.jobs.<job>.container
        payload: ubuntu:24.04
        validity: >-
          A valid unlisted JOB key. This was the last level still closed by a blacklist: the event
          mapping, the action inputs and the checkout inputs were converted to allowlists while the
          job mapping kept enumerating prohibited keys, so a key nobody thought to forbid was
          permitted by default.
        diagnostic: "job mapping: unlisted key `container`"
      - id: C3.job-mapping-allowlist/needs
        op: add
        side: local
        target: $.jobs.<job>.needs
        payload: "[support]"
        # This case needs more than a key edit and says so.
        declares_support_job:
          id: support
          runs-on: ubuntu-latest
          steps:
            - run: exit 1
          why: >-
            `needs:` only changes the observable outcome when the dependency FAILS; with a passing
            dependency the job still runs and the mutant would survive.
        validity: the support job must fail, or the mutant does not change the intended property
        diagnostic: "job mapping: unlisted key `needs`"
      - id: C3.job-mapping-allowlist/strategy-matrix
        op: add
        side: local
        target: $.jobs.<job>.strategy
        payload: "matrix: {n: [1, 2]}"
        validity: a matrix multiplies the job and the context name, breaking cell 14's census
        diagnostic: "job mapping: unlisted key `strategy`"

  - id: C3.permissions-pinned-at-job
    clause: C3
    kind: yaml
    entries: [required, canary]
    statement: >-
      `permissions:` is pinned to exactly `contents: read` at JOB scope as well as at the root.
      GitHub calculates the token workflow-level THEN job-level, so a job-level widening satisfies
      both allowlists while widening the effective token.
    target: $.jobs.<job>.permissions
    cases:
      - id: C3.permissions-pinned-at-job/write-all
        op: set
        side: local
        target: $.jobs.<job>.permissions
        payload: write-all
        validity: widens the effective token at the scope revision 24 left unconstrained
        diagnostic: "job permissions: expected `contents: read`, found `write-all`"
      - id: C3.permissions-pinned-at-job/widened-scope
        op: set
        side: local
        target: $.jobs.<job>.permissions
        payload: "{contents: read, checks: write}"
        validity: a single widened scope at job level
        diagnostic: "job permissions: expected `contents: read`, found an extra scope"
      - id: C3.permissions-pinned-at-job/absent
        op: remove
        side: local
        target: $.jobs.<job>.permissions
        validity: absence inherits the workflow-level value rather than pinning it here
        diagnostic: "job permissions: key is absent"

  - id: C3.nothing-skips-or-masks
    clause: C3
    kind: yaml
    entries: [required]
    statement: >-
      No `if:` and no `continue-on-error:` on the job OR on ANY of the five steps. A job skipped by a
      conditional REPORTS SUCCESS to a required context; an `if: false` on a GUARD step preserves both
      the frozen sequence and the frozen body digest while removing the guard entirely.
    target: $.jobs.<job>.if, $.jobs.<job>.continue-on-error, $.jobs.<job>.steps[*].if, $.jobs.<job>.steps[*].continue-on-error
    milestone_exemption:
      until: M3
      scope: job
      key: continue-on-error
      why: >-
        M2 deliberately ships job-scoped `continue-on-error: true` so cell 2's M2 half is observable.
        Asserting C3 at M2 would make the suite intentionally red. The cell is WRITTEN at M2 and
        ENABLED at M3.
    cases:
      - id: C3.nothing-skips-or-masks/job-if
        op: add
        side: local
        target: $.jobs.<job>.if
        payload: github.event_name != 'workflow_dispatch'
        validity: valid syntax, and strictly worse than the hazard it was written to fix
        diagnostic: "job: `if:` is prohibited (a skipped job reports Success)"
      - id: C3.nothing-skips-or-masks/job-continue-on-error
        op: add
        side: local
        target: $.jobs.<job>.continue-on-error
        payload: "true"
        validity: enabled only from M3, per the exemption above
        diagnostic: "job: `continue-on-error:` is prohibited"
      - id: C3.nothing-skips-or-masks/step-continue-on-error
        op: add
        side: local
        target: $.jobs.<job>.steps[trunk].continue-on-error
        payload: "true"
        validity: step scope rewrites the step's reported conclusion to success
        diagnostic: "step `trunk`: `continue-on-error:` is prohibited"

  - id: C3.no-defaults-run
    clause: C3
    kind: yaml
    entries: [required, canary]
    statement: No workflow- or job-level `defaults.run`, which can redirect `shell` or `working-directory` for every step at once.
    target: $.defaults.run, $.jobs.<job>.defaults.run
    cases:
      - id: C3.no-defaults-run/workflow
        op: add
        side: local
        target: $.defaults.run
        payload: "shell: bash -e {0}"
        validity: reaches every step without touching any step mapping
        diagnostic: workflow `defaults.run` is prohibited
      - id: C3.no-defaults-run/job
        op: add
        side: local
        target: $.jobs.<job>.defaults.run
        payload: "working-directory: /tmp"
        validity: the job-scope sibling
        diagnostic: job `defaults.run` is prohibited
  - id: C3.exactly-one-trunk-invocation
    clause: C3
    kind: yaml
    entries: [required]
    statement: Exactly one unconditional Trunk invocation.
    target: $.jobs.<job>.steps[*]
    cases:
      - id: C3.exactly-one-trunk-invocation/zero
        op: remove
        side: local
        target: $.jobs.<job>.steps[trunk]
        validity: omission — the job reports success having linted nothing
        diagnostic: "steps: expected exactly one Trunk invocation, found 0"
      - id: C3.exactly-one-trunk-invocation/two
        op: duplicate
        side: local
        target: $.jobs.<job>.steps[trunk]
        validity: two invocations make the reported conclusion ambiguous
        diagnostic: "steps: expected exactly one Trunk invocation, found 2"

  # ------------------------------------------------------------------ C4: action inputs ----------
  - id: C4.with-inputs-allowlist
    clause: C4
    kind: yaml
    entries: [required, canary]
    statement: >-
      The action's `with:` inputs are an ALLOWLIST — only `arguments`, `save-annotations`, and
      optionally `cache`/`cache-key`.
    target: $.jobs.<job>.steps[trunk].with
    cases:
      - id: C4.with-inputs-allowlist/trunk-path
        op: add
        side: local
        target: .with.trunk-path
        payload: /bin/true
        validity: >-
          It NAMES THE EXECUTED LAUNCHER. A no-op launcher returning 0 satisfies every prohibition
          while linting nothing — the defect that inverted this clause from a blacklist.
        diagnostic: "action inputs: unlisted input `trunk-path`"
      - id: C4.with-inputs-allowlist/post-init
        op: add
        side: local
        target: .with.post-init
        payload: echo hi
        validity: the action's own docs call it "a caller-controlled escape hatch"
        diagnostic: "action inputs: unlisted input `post-init`"
      - id: C4.with-inputs-allowlist/arbitrary-input
        op: add
        side: local
        target: .with.check-mode
        payload: popular
        validity: >-
          A valid unlisted input, and inherited defect 1. `post-annotations: false` is the same shape:
          under an ALLOWLIST it is an unlisted key PRESENT in `with:`, so "absent-or-false" is
          superseded — cells 9 and 11 disagreed while the blacklist wording stood.
        diagnostic: "action inputs: unlisted input `check-mode`"

  - id: C4.arguments-required-literal
    clause: C4
    kind: yaml
    entries: [required]
    statement: >-
      `arguments:` must be PRESENT and equal §6.4's declared literal as a WHOLE STRING. Absence is a
      failure, not a permitted variant: absent means `markdown-link-check` runs in the required job.
      The literal's bytes are stated only in §6.4 — a derived value written twice goes stale, and two
      stale copies agree with each other.
    target: $.jobs.<job>.steps[trunk].with.arguments
    literal_source: §6.4
    cases:
      - id: C4.arguments-required-literal/absent
        op: remove
        side: local
        target: .with.arguments
        validity: omission; the failure mode a presence-only check misses
        diagnostic: "action inputs: `arguments` is absent"
      - id: C4.arguments-required-literal/appended
        op: append
        side: local
        target: .with.arguments
        payload: " --fix"
        validity: >-
          An APPENDED argument still satisfies a substring or "contains --filter" test. Only a
          whole-string match kills it.
        diagnostic: "action inputs: `arguments` does not equal the declared literal"

  - id: C4.save-annotations-required
    clause: C4
    kind: yaml
    entries: [required]
    statement: >-
      §6.1 chose option (b), so `save-annotations` is REQUIRED-PRESENT and true. Absent, the action
      falls back to `--github-annotate` and 403s under `contents: read`.
    target: $.jobs.<job>.steps[trunk].with.save-annotations
    cases:
      - id: C4.save-annotations-required/absent
        op: remove
        side: local
        target: .with.save-annotations
        validity: omission case
        diagnostic: "action inputs: `save-annotations` is absent"
      - id: C4.save-annotations-required/false
        op: set
        side: local
        target: .with.save-annotations
        payload: "false"
        validity: present but valued so the action takes the annotating branch
        diagnostic: "action inputs: `save-annotations` must be true"

  # ------------------------------------------------------------------ C5: env -------------------
  - id: C5.no-env-any-scope
    clause: C5
    kind: yaml
    entries: [required, canary]
    statement: >-
      No `env:` at workflow, job OR step scope. The action's scripts read `TRUNK_PATH`, `POST_INIT`
      and friends FROM THE ENVIRONMENT, so a `with:` allowlist alone does not constrain them, and
      workflow-level `env:` is inherited by every step in every job.
    target: $.env, $.jobs.<job>.env, $.jobs.<job>.steps[*].env
    cases:
      - id: C5.no-env-any-scope/workflow
        op: add
        side: local
        target: $.env
        payload: "TRUNK_PATH: /bin/true"
        validity: reaches the action untouched; revision 10's clause covered only two scopes
        diagnostic: workflow-level `env:` is prohibited
      - id: C5.no-env-any-scope/job
        op: add
        side: local
        target: $.jobs.<job>.env
        payload: "TRUNK_PATH: /bin/true"
        validity: redirects execution to a binary that exits 0
        diagnostic: job-level `env:` is prohibited
      - id: C5.no-env-any-scope/step
        op: add
        side: local
        target: $.jobs.<job>.steps[trunk].env
        payload: "BASH_ENV: /tmp/x"
        validity: alters every Bash process the action spawns
        diagnostic: step-level `env:` is prohibited
  # ------------------------------------------------------------------ C6: repo-supplied tool -----
  - id: C6.no-repository-supplied-launcher
    clause: C6
    kind: repo_fixture
    entries: [required, canary]
    statement: >-
      THE REPOSITORY MAY NOT SUPPLY THE TOOL THAT TESTS IT. Verified at the pinned SHA:
      `setup/locate_trunk.sh` prefers a checked-out `.trunk/bin/trunk`, `tools/trunk` or `./trunk`
      before downloading, and `action.yaml:289` EXECUTES a checked-out `.trunk/setup-ci` as a
      composite action, which can rewrite TRUNK_PATH through GITHUB_ENV. A guard step, LAST before the
      action, fails if any of these paths exists in the checked-out tree.
    guard_position: immediately before the action
    cases:
      - id: C6.no-repository-supplied-launcher/trunk-bin
        op: materialise
        side: local
        target: .trunk/bin/trunk
        fixture: .trunk/bin/trunk
        validity: executable file; the first path locate_trunk.sh consults
        diagnostic: "repository supplies a launcher: .trunk/bin/trunk"
      - id: C6.no-repository-supplied-launcher/tools-trunk
        op: materialise
        side: local
        target: tools/trunk
        fixture: tools/trunk
        validity: executable file
        diagnostic: "repository supplies a launcher: tools/trunk"
      - id: C6.no-repository-supplied-launcher/dot-trunk
        op: materialise
        side: local
        target: ./trunk
        fixture: ./trunk
        validity: executable file; a guard that catches three of four is a gate with one door open
        diagnostic: "repository supplies a launcher: ./trunk"
      - id: C6.no-repository-supplied-launcher/setup-ci
        op: materialise
        side: local
        target: .trunk/setup-ci/action.yml
        fixture: .trunk/setup-ci/action.yml
        validity: >-
          MUST BE A VALID COMPOSITE ACTION THAT EXITS GREEN. `uses: ./.trunk/setup-ci` expects an
          ACTION DIRECTORY, so a bare no-op executable reds because it is MALFORMED — the mutant would
          then survive deletion of C6 while still appearing to be caught.
        diagnostic: "repository supplies a launcher: .trunk/setup-ci"
      - id: C6.no-repository-supplied-launcher/user-yaml
        op: materialise
        side: local
        target: .trunk/user.yaml
        fixture: .trunk/user.yaml
        validity: overrides the configuration cell 4 freezes
        diagnostic: "repository overrides trunk configuration: .trunk/user.yaml"
      - id: C6.no-repository-supplied-launcher/env-yaml
        op: materialise
        side: local
        target: .trunk/env.yaml
        fixture: .trunk/env.yaml
        validity: the sibling override path
        diagnostic: "repository overrides trunk configuration: .trunk/env.yaml"
      - id: C6.no-repository-supplied-launcher/user-trunk-yaml
        op: materialise
        side: local
        target: .trunk/user_trunk.yaml
        fixture: .trunk/user_trunk.yaml
        validity: >-
          trunk merges user_trunk.yaml exactly as it merges user.yaml -- .trunk/.gitignore lists
          both, one line apart -- and the guard's enumeration named only the second. Measured: a
          tracked user_trunk.yaml disabling two linters takes `trunk check --ci --upstream` from
          exit 1 / "2 failures" to exit 0 / "Found no applicable linters", with the guard passing.
        diagnostic: "repository overrides trunk configuration: .trunk/user_trunk.yaml"

  # ------------------------------------------------------------------ C6a: shared resolver -------
  - id: C6a.resolver-pinned-by-digest
    clause: C6a
    kind: content_digest
    entries: [required, canary]
    statement: >-
      `scripts/ci/resolve-trunk-range.sh` lives in the checked-out tree, so C8's run-body digest CANNOT
      reach it: a `run:` body that invokes the script hashes identically whatever the script contains.
      A PR could edit the resolver so the empty-diff guard passes on a range the action never lints —
      inherited defect 3 wearing a new file name. The script is its own content_digest entry, and the
      digest is verified BEFORE the step that EXECUTES it.
    target: scripts/ci/resolve-trunk-range.sh
    guard_position: before the empty-diff guard (which executes the script)
    cases:
      - id: C6a.resolver-pinned-by-digest/edit-resolver
        op: edit_bytes
        side: local
        target: scripts/ci/resolve-trunk-range.sh
        payload: make the resolver print an always-nonempty range
        validity: >-
          The invoking `run:` bodies are left UNTOUCHED, so C8's digests still match — this is exactly
          the hole C8 cannot see. The guard must red on the digest mismatch AND must do so BEFORE the
          empty-diff step executes the edited script: assert the FAILING STEP IS THE C6a GUARD, not a
          later one. A guard that reds after execution proves the wrong property.
        diagnostic: "resolver digest mismatch: scripts/ci/resolve-trunk-range.sh"

  # ------------------------------------------------------------------ C7: merge queue ------------
  - id: C7.no-merge-group
    clause: C7
    kind: yaml
    entries: [required]
    statement: >-
      A merge queue is a STOP, not a configuration. At the pinned SHA `determine_check_mode.sh` matches
      `merge_group` in NO branch, so it falls through to check_mode=none: every real step is skipped
      and the composite action SUCCEEDS — the forbidden false success. C4 forbids forcing check-mode to
      repair it. If M4's preflight finds a merge queue on `Control`, stop and redesign.
    target: $.on.merge_group
    cases:
      - id: C7.no-merge-group/present
        op: add
        side: local
        target: $.on.merge_group
        payload: "{}"
        validity: constructible; produces a green context with no lint
        diagnostic: "event set: `merge_group` is prohibited (check_mode=none is a false success)"

  # ------------------------------------------------------------------ C8: step sequence ----------
  - id: C8.step-sequence-allowlist
    clause: C8
    kind: yaml
    entries: [required]
    statement: >-
      Exactly, in order: `actions/checkout` (SHA-pinned) -> the C6a resolver-digest guard -> the
      empty-diff guard -> the C6 launcher-path guard -> the action. FIVE steps. The two guards are
      separate because their correct positions differ: C6a's must precede the step that EXECUTES the
      resolver, and C6's must be the LAST thing before the action so nothing can create a launcher
      path behind its back.
    target: $.jobs.<job>.steps
    step_ids:
      [
        checkout,
        guard-resolver-digest,
        guard-empty-diff,
        guard-launcher-path,
        trunk,
      ]
    cases:
      - id: C8.step-sequence-allowlist/extra-step
        op: insert
        side: local
        target: before trunk
        payload: "run: echo hi"
        validity: a step where one could create a C6 path after the guard had passed
        diagnostic: "step sequence: unexpected step before `trunk`"
      - id: C8.step-sequence-allowlist/guard-moved
        op: move
        side: local
        target: guard-launcher-path
        payload: before guard-empty-diff
        validity: >-
          Revision 10 had this wrong: it placed the empty-diff guard BETWEEN C6's guard and the action,
          so a permitted, already-allowlisted step sat exactly where it could create `tools/trunk`
          AFTER the guard had run. The "extra step" and "moved guard" mutants killed neither, because
          the mutation lives INSIDE a step the sequence allows.
        diagnostic: "step sequence: `guard-launcher-path` is not immediately before `trunk`"
      # Each of the five steps DELETED, as five separate cases with their own diagnostics: revision
      # 22's single "a step deleted" case left a validator that requires the empty-diff step while
      # ACCEPTING omission of the C6 guard passing every listed mutant.
      - id: C8.step-sequence-allowlist/delete-checkout
        op: remove
        side: local
        target: steps[checkout]
        validity: omission case, one per step
        diagnostic: "step sequence: `checkout` is absent"
      - id: C8.step-sequence-allowlist/delete-guard-resolver-digest
        op: remove
        side: local
        target: steps[guard-resolver-digest]
        validity: un-verifies the resolver before it executes
        diagnostic: "step sequence: `guard-resolver-digest` is absent"
      - id: C8.step-sequence-allowlist/delete-guard-empty-diff
        op: remove
        side: local
        target: steps[guard-empty-diff]
        validity: restores inherited defect 3 — a green run over an empty diff
        diagnostic: "step sequence: `guard-empty-diff` is absent"
      - id: C8.step-sequence-allowlist/delete-guard-launcher-path
        op: remove
        side: local
        target: steps[guard-launcher-path]
        validity: ships the repository-launcher hole
        diagnostic: "step sequence: `guard-launcher-path` is absent"
      - id: C8.step-sequence-allowlist/delete-trunk
        op: remove
        side: local
        target: steps[trunk]
        validity: the job reports success having linted nothing
        diagnostic: "step sequence: `trunk` is absent"
      - id: C8.step-sequence-allowlist/arbitrary-step-key
        op: add
        side: local
        target: steps[guard-empty-diff].id
        payload: x
        validity: a valid complete-step key outside the allowlist
        diagnostic: "step `guard-empty-diff`: unlisted key `id`"

  - id: C8.run-bodies-frozen
    clause: C8
    kind: content_digest
    entries: [required]
    statement: >-
      ALL THREE permitted `run:` steps are frozen BY CONTENT, and NONE may write to `$GITHUB_ENV` or
      `$GITHUB_PATH` at all. Freezing the SEQUENCE stopped a new step being added; it did nothing about
      what the allowed steps DO. It is the COMPLETE STEP MAPPING that is frozen — `shell`,
      `working-directory`, `if`, `continue-on-error`, `env` and every other key — so a step cannot be
      neutralised by a sibling key while its body hashes unchanged.
    target: steps[guard-resolver-digest], steps[guard-empty-diff], steps[guard-launcher-path]
    # Each run step gets its OWN independently identified body-digest case: a validator could
    # otherwise pin an old pair and let the third become `exit 0`.
    cases:
      - id: C8.run-bodies-frozen/body-digest-guard-resolver-digest
        op: edit_bytes
        side: local
        target: steps[guard-resolver-digest].run
        validity: independently identified per step
        diagnostic: "step `guard-resolver-digest`: run body digest mismatch"
      - id: C8.run-bodies-frozen/body-digest-guard-empty-diff
        op: edit_bytes
        side: local
        target: steps[guard-empty-diff].run
        validity: independently identified per step
        diagnostic: "step `guard-empty-diff`: run body digest mismatch"
      - id: C8.run-bodies-frozen/body-digest-guard-launcher-path
        op: edit_bytes
        side: local
        target: steps[guard-launcher-path].run
        validity: independently identified per step
        diagnostic: "step `guard-launcher-path`: run body digest mismatch"
      - id: C8.run-bodies-frozen/github-env-trunk-path
        op: append
        side: local
        target: steps[guard-empty-diff].run
        payload: >-
          echo TRUNK_PATH=/bin/true >> "$GITHUB_ENV"
        validity: the C6 guard inspects PATHS, not inherited runner state
        diagnostic: "step `guard-empty-diff`: writes to $GITHUB_ENV"
      - id: C8.run-bodies-frozen/github-env-bash-env
        op: append
        side: local
        target: steps[guard-empty-diff].run
        payload: >-
          echo BASH_ENV=/tmp/x >> "$GITHUB_ENV"
        validity: alters every Bash process the action spawns
        diagnostic: "step `guard-empty-diff`: writes to $GITHUB_ENV"
      - id: C8.run-bodies-frozen/github-path
        op: append
        side: local
        target: steps[guard-empty-diff].run
        payload: >-
          echo /tmp/fake >> "$GITHUB_PATH"
        validity: >-
          `$GITHUB_PATH` was PROHIBITED WITHOUT EVER BEING MUTATED for two revisions. A validator that
          normalises away $GITHUB_PATH lines before hashing survives every generic byte edit; only an
          independently encoded case kills it.
        diagnostic: "step `guard-empty-diff`: writes to $GITHUB_PATH"
      - id: C8.run-bodies-frozen/creates-c6-path
        op: append
        side: local
        target: steps[guard-empty-diff].run
        payload: install -D /bin/true tools/trunk
        validity: the case revision 10's ordering made unkillable
        diagnostic: "step `guard-empty-diff`: creates a prohibited launcher path"
      - id: C8.run-bodies-frozen/changed-shell
        op: set
        side: local
        target: steps[guard-empty-diff].shell
        payload: sh
        validity: >-
          `shell` is valid ONLY on `run:` steps. `actions/checkout` and the Trunk action are `uses:`
          steps, where actionlint rejects `shell` as an unexpected key — so mutating them through
          `shell` produces schema failures instead of contract diagnostics, breaking case validity and
          making cell 11 unable to pass at M2. The `uses:` steps are mutated through their `with:`
          inputs and an added `env:` instead.
        diagnostic: "step `guard-empty-diff`: complete step mapping changed"
      - id: C8.run-bodies-frozen/changed-working-directory
        op: set
        side: local
        target: steps[guard-empty-diff].working-directory
        payload: /tmp
        validity: >-
          Frozen by C8 while revision 16 mutated it NOWHERE, so a validator checking body digest,
          `if`, `continue-on-error` and `shell` but forgetting `working-directory` passed every case.
        diagnostic: "step `guard-empty-diff`: complete step mapping changed"

  - id: C8.checkout-inputs-allowlist
    clause: C8
    kind: yaml
    entries: [required, canary]
    statement: >-
      `actions/checkout`'s own inputs are allowlisted: `fetch-depth` (optional), `lfs: true`
      (REQUIRED) and `persist-credentials: false` (REQUIRED). Freezing its identity and SHA is not
      enough.
    target: steps[checkout].with
    cases:
      - id: C8.checkout-inputs-allowlist/sparse-checkout
        op: add
        side: local
        target: steps[checkout].with.sparse-checkout
        payload: scripts/
        validity: >-
          A well-meaning optimisation can leave changed files ABSENT FROM DISK while git metadata still
          yields a non-empty range — the empty-diff guard passes and Trunk lints files that are not
          there. An ACCIDENT, squarely inside §0's threat model.
        diagnostic: "checkout inputs: unlisted input `sparse-checkout`"
      - id: C8.checkout-inputs-allowlist/ref
        op: add
        side: local
        target: steps[checkout].with.ref
        payload: main
        validity: checks out other bytes than the PR's
        diagnostic: "checkout inputs: unlisted input `ref`"
      - id: C8.checkout-inputs-allowlist/repository
        op: add
        side: local
        target: steps[checkout].with.repository
        payload: other/repo
        validity: lints a different repository
        diagnostic: "checkout inputs: unlisted input `repository`"
      - id: C8.checkout-inputs-allowlist/path
        op: add
        side: local
        target: steps[checkout].with.path
        payload: sub
        validity: relocates the tree the guards inspect
        diagnostic: "checkout inputs: unlisted input `path`"
      - id: C8.checkout-inputs-allowlist/filter
        op: add
        side: local
        target: steps[checkout].with.filter
        payload: blob:none
        validity: NAMED but unmutated for several revisions
        diagnostic: "checkout inputs: unlisted input `filter`"
      - id: C8.checkout-inputs-allowlist/arbitrary-input
        op: add
        side: local
        target: steps[checkout].with.submodules
        payload: "true"
        validity: a valid unlisted input at the allowlist boundary
        diagnostic: "checkout inputs: unlisted input `submodules`"
      - id: C8.checkout-inputs-allowlist/lfs-removed
        op: remove
        side: local
        target: steps[checkout].with.lfs
        validity: >-
          REQUIRED-PRESENT, and its failure mode is OMISSION. checkout defaults `lfs` to false, so a PR
          introducing an LFS-tracked source checks out the POINTER FILE: the diff stays non-empty, the
          guard passes, and Trunk lints a 130-byte pointer and reports green. Every checkout mutant in
          revision 20 was a prohibited-key ADDITION, so obligations whose failure mode is a MISSING key
          were untested.
        diagnostic: "checkout inputs: `lfs` is absent"
      - id: C8.checkout-inputs-allowlist/lfs-false
        op: set
        side: local
        target: steps[checkout].with.lfs
        payload: "false"
        validity: present but valued to the hazard
        diagnostic: "checkout inputs: `lfs` must be true"
      - id: C8.checkout-inputs-allowlist/persist-credentials-removed
        op: remove
        side: local
        target: steps[checkout].with.persist-credentials
        validity: >-
          checkout persists the job credential BY DEFAULT, and zizmor's `artipacked` — one of the 19
          linters THIS GATE REQUIRES — reports it. A workflow without this input FAILS THE GATE IT
          DEFINES, with the only in-workflow remedy prohibited.
        diagnostic: "checkout inputs: `persist-credentials` is absent"
      - id: C8.checkout-inputs-allowlist/persist-credentials-true
        op: set
        side: local
        target: steps[checkout].with.persist-credentials
        payload: "true"
        validity: present but valued to the hazard
        diagnostic: "checkout inputs: `persist-credentials` must be false"

  # ------------------------------------------------------------------ C9: the action pin ---------
  - id: C9.action-pinned-by-sha
    clause: C9
    kind: yaml
    entries: [required, canary]
    statement: >-
      The action is pinned by EXACT SHA — trunk-io/trunk-action@e1234e67…. Nothing in C1–C8 required
      it, and cell 9 asserted only that `actions/checkout` was pinned, so a tag or a different SHA
      satisfied every other clause. (v1.3.0 and v1.3.1 resolve to the SAME SHA — tags in this action
      have moved, which is exactly why AGENT_CONTRACTS §6 requires SHAs.)
    target: steps[trunk].uses
    cases:
      - id: C9.action-pinned-by-sha/tag
        op: set
        side: local
        target: steps[trunk].uses
        payload: trunk-io/trunk-action@v2.0.0
        validity: a moving reference; constructible and valid
        diagnostic: "action pin: `trunk-io/trunk-action` is not pinned by SHA"
      - id: C9.action-pinned-by-sha/different-sha
        op: set
        side: local
        target: steps[trunk].uses
        payload: trunk-io/trunk-action@0000000000000000000000000000000000000000
        validity: pinned, but not to the reviewed bytes
        diagnostic: "action pin: unexpected SHA"

  # ------------------------------------------------------------------ C16: the canary ------------
  - id: C16.canary-branches-equal-resolved-target-set
    clause: C1-canary
    kind: remote_relation
    entries: [canary]
    statement: "The canary's `on: push` `branches:` equals the ruleset's RESOLVED target set."
    family: target_set_resolution
    cases:
      - id: C16.canary-branches-equal-resolved-target-set/local-divergence
        op: set
        side: local
        target: $.on.push.branches
        payload: "[main]"
        validity: the LOCAL half for the canary entry
        diagnostic: "target set mismatch: canary branches != resolved ruleset target set"

  - id: C16.canary-continue-on-error-job-scope
    clause: C1-canary
    kind: yaml
    entries: [canary]
    statement: >-
      `continue-on-error: true` PERMANENTLY, AT JOB SCOPE. The canary cannot block because its context
      is NOT REQUIRED — not because its job goes green: job-scope leaves the job concluding FAILURE and
      merely stops it failing the workflow RUN. Step-scope would rewrite the Trunk step's conclusion to
      success and make the canary blind to the failure it exists to surface.
    target: $.jobs.trunk-check-push.continue-on-error
    expected_tuple:
      trunk_step: failure
      job: failure
      workflow_run: not_failed
    cases:
      - id: C16.canary-continue-on-error-job-scope/step-scope
        op: move
        side: local
        target: continue-on-error
        payload: to steps[trunk]
        validity: produces a canary structurally incapable of showing the failure it exists to surface
        diagnostic: "canary: `continue-on-error` must be at JOB scope, not step scope"
      - id: C16.canary-continue-on-error-job-scope/absent
        op: remove
        side: local
        target: $.jobs.trunk-check-push.continue-on-error
        validity: omission case
        diagnostic: "canary: job-scoped `continue-on-error` is absent"

  - id: C16.canary-not-required
    clause: C1-canary
    kind: remote_relation
    entries: [canary]
    statement: >-
      `trunk-check-push` is ABSENT from ruleset `Control`'s required-status-check list at rollout. A
      committed ruleset observation is a POINT-IN-TIME read — it cannot prove "never", and claiming so
      would be a cell asserting more than its owner can see. Re-verified in M4's post-edit readback.
    target: ruleset Control -> required_status_checks[].context
    cases:
      - id: C16.canary-not-required/present
        op: add
        side: remote
        target: injected ruleset observation
        payload: "context: trunk-check-push"
        validity: >-
          Mutates an INJECTED observation, never the live ruleset. If required, ordinary PRs would sit
          pending (it is a push-only context) and a main->alpha PR would gain a same-SHA substitute.
        diagnostic: "ruleset: `trunk-check-push` must not be a required context"
